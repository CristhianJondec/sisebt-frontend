name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, test y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Debe ir ANTES de setup-node: `cache: pnpm` necesita que el binario ya
      # exista. La version sale de package.json#packageManager.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests unitarios y de integracion
        run: pnpm test

      - name: Build de produccion
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
