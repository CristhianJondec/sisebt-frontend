name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, test y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Debe ir ANTES de setup-node: `cache: pnpm` necesita que el binario ya
      # exista. La version sale de package.json#packageManager.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios y de integracion
        run: pnpm test

      - name: Build de produccion
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # --with-deps instala tambien las librerias de sistema que Chromium
      # necesita en el runner de Ubuntu.
      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests E2E
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

      - name: Publicar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
